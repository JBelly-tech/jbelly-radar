name: demo

# Publishes the dashboard to GitHub Pages over a SAMPLE snapshot committed to
# the repository, so the first thing a visitor can do is look at the thing
# rather than install it.
#
# It deliberately does NOT sync. A demo that re-syncs runs forever on the
# owner's account: their Actions, their name in the user agent, and their
# machine asking 54 other people's servers for data every day so that strangers
# can look at a page. The point of the demo is that someone sees the shape and
# then runs it themselves, which a frozen sample does exactly as well. It also
# cannot pretend to be live, which the banner on the page says outright.
#
# So this workflow reads data/sample/, copies files, and deploys. No network,
# no third-party load, nothing recurring in anyone's name.

on:
  push:
    branches: [main]
    # only when something that changes the published page changes
    paths:
      - 'app/**'
      - 'data/sample/**'
      - 'scripts/build-pages.ps1'
      - '.github/workflows/pages.yml'
  # fires the moment the repository goes from private to public, so the README's
  # demo link is never dead
  public:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-done: a cancelled deploy
# can leave the site serving a partly-written tree.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: stage the sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stage the site
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-pages.ps1 -Sample -OutDir _site

      - name: Check the sample is intact
        shell: pwsh
        run: |
          $page = Get-Content -Raw _site/app/index.html
          if ($page -notmatch 'window\.RADAR_STATIC = true') { Write-Host '::error::the static flag did not land'; exit 1 }
          if ($page -notmatch 'Beta') { Write-Host '::error::the beta notice did not land'; exit 1 }
          if (Test-Path _site/app/ops) { Write-Host '::error::the operator console must not ship'; exit 1 }
          $js = Get-Content -Raw _site/data/trends.js
          if ($js.Length -lt 100000) { Write-Host "::error::trends.js is only $($js.Length) bytes"; exit 1 }
          Write-Host "staged: $((Get-ChildItem _site -Recurse -File).Count) files"

      - uses: actions/configure-pages@v5
        if: github.event.repository.visibility == 'public'
        with:
          # turns Pages on if it was never enabled; without it the first run
          # after going public fails on "Get Pages site failed ... Not Found"
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event.repository.visibility == 'public'
        with:
          path: _site

  deploy:
    name: publish
    needs: build
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
