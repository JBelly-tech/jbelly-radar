name: ci

# Budgeted for GitHub's Free plan, where a PRIVATE repository gets 2,000 Actions
# minutes a month and a job is billed at 1x on Linux, 2x on Windows and 10x on
# macOS, rounded up to the minute. Every choice below is that arithmetic:
#
#   per push   ubuntu checks 1x + windows checks 2x + ubuntu harness 1x  ~= 8 min
#   per day    the live sync, once, on Linux                             ~= 2 min
#   macOS      on request only -- one 3-minute run costs 30
#
# That is roughly 460 billed minutes for fifty pushes in a month, against 2,000.
#
# A PUBLIC repository has no Actions limit at all, so when this one is published
# the macOS job can move back onto every push and the matrices can widen. Until
# then the cheap combination is chosen deliberately: Linux proves POSIX, Windows
# proves the 5.1 path, and those two cover every claim the README makes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 06:00 UTC daily, for the live source check below
    # Monday 06:00 UTC. Weekly, not daily: the source check below is the only
    # thing here that touches anyone else's servers, and it runs in the
    # maintainer's name. Once a week is enough to notice a source that has gone
    # quiet, and seven times less traffic pointed at people who did not ask for
    # it. The published demo does not sync at all.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # Everything runs on `pwsh` -- PowerShell 7, which ships on all three runner
  # images. Claiming this runs on Linux is only worth doing if something checks
  # it on every push.
  check:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Test suite (parser, config, tokens, page structure)
        shell: pwsh
        run: pwsh -NoProfile -File tests/check.ps1

  # PSScriptAnalyzer once, on the 1x runner. It installs a module on every run,
  # which costs about a minute, and it reads the same files whatever the OS --
  # so running it per-platform bought nothing and cost triple.
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          Write-Host "PSScriptAnalyzer: no errors"

  # The browser harnesses need the dashboard served; they do not need a sync.
  # run-harness.ps1 seeds tests/fixtures/trends.min.json when data/trends.json is
  # absent, which is exactly what a fresh clone sees.
  #
  # Linux only. The harness exercises client-side JavaScript in Chromium, which
  # is the same engine on every platform, so a second run on the 2x runner was
  # paying double for the same evidence. The Windows-specific part of the runner
  # -- its process sweep -- is covered by the checks job above.
  harness:
    name: browser harness
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      - name: Serve and run the harnesses
        shell: pwsh
        run: |
          $p = Start-Process pwsh -ArgumentList '-NoProfile','-File','radar.ps1','-NoSync','-NoOpen' -PassThru
          $code = 1
          try {
            # poll rather than sleep a fixed time: a cold runner is slower than a warm one
            $up = $false
            foreach ($i in 1..30) {
              try { Invoke-WebRequest 'http://localhost:8477/api/status' -UseBasicParsing -TimeoutSec 2 | Out-Null; $up = $true; break }
              catch { Start-Sleep -Milliseconds 700 }
            }
            if (-not $up) { Write-Host 'radar.ps1 never started serving'; exit 1 }
            pwsh -NoProfile -File tests/run-harness.ps1
            $code = $LASTEXITCODE
          }
          finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          exit $code

  # macOS on request only. One run costs 30 billed minutes at the 10x rate, and
  # macOS and Linux run the same pwsh on the same .NET, so a Linux pass is
  # already strong evidence. Run it by hand before a release, or let it rejoin
  # every push once this repository is public and minutes stop being counted.
  check-macos:
    name: checks (macos-latest)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event.repository.visibility == 'public'
    steps:
      - uses: actions/checkout@v5

      - shell: pwsh
        run: pwsh -NoProfile -File tests/check.ps1

  # The weekly sync. It does two jobs that share one read of the sources, which
  # is the whole reason they are one job: reading 54 servers that belong to
  # other people twice, to produce two artefacts from the same data, would be
  # rude for no gain.
  #
  #   1. It reports source health, so a feed that has gone quiet is noticed.
  #      This does not gate: a third party going down is not this project
  #      breaking, hence continue-on-error.
  #   2. It refreshes data/index.json, which the published agent skill fetches.
  #      That file is the only thing in this repository that other people's
  #      tools depend on being current, and a skill promising "from a record"
  #      over a record nobody refreshes is just a stale search.
  sources:
    name: weekly sync and index
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    # the one job here allowed to write, and only so the refreshed index and
    # ledger land in the repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Live sync
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh -NoProfile -File scripts/sync.ps1

      - name: Report source health
        shell: pwsh
        run: |
          $d = Get-Content -Raw -Encoding UTF8 data/trends.json | ConvertFrom-Json
          $d.sources | Select-Object id, status, count, kept, fetched, ms | Format-Table -AutoSize | Out-String | Write-Host
          $failed = @($d.sources | Where-Object { $_.status -ne 'ok' })
          Write-Host ("{0} items, {1} source(s) not ok" -f $d.counts.total, $failed.Count)

      - name: Rebuild the published index
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-index.ps1

      # A thin sync must not overwrite a good index with a worse one. The radar
      # keeps every row it has ever seen, so the catalogue only grows; an index
      # that suddenly shrank means the sync failed, not that the world did.
      - name: Refuse to publish a shrunken index
        shell: pwsh
        run: |
          $new = (Get-Content -Raw -Encoding UTF8 data/index.json | ConvertFrom-Json).counts.items
          git stash push --quiet data/index.json
          $old = (Get-Content -Raw -Encoding UTF8 data/index.json | ConvertFrom-Json).counts.items
          git stash pop --quiet
          Write-Host ("index: {0} -> {1} items" -f $old, $new)
          if ($new -lt $old) { Write-Host "::error::the index shrank from $old to $new; not committing"; exit 1 }

      - name: Commit the refreshed record
        shell: pwsh
        run: |
          git config user.name  'JBelly'
          git config user.email 'jbelly-tech@users.noreply.github.com'
          git add data/index.json data/ledger.json
          if (git diff --cached --quiet) { Write-Host 'nothing changed'; exit 0 }
          $n = (Get-Content -Raw -Encoding UTF8 data/index.json | ConvertFrom-Json).counts.items
          git commit -m "Refresh the published record ($n items)" -m "Weekly sync. data/index.json is what the agent skill fetches."
          git push
